# =============================================================================
#  nginx - CVM Monitor PRO (SPA React + proxy da API)
#  Em producao (Render) o proprio main.py serve o dist/ com StaticFiles. No
#  Docker separamos as responsabilidades: nginx entrega os estaticos (que e o
#  que ele faz melhor) e repassa /api para o Uvicorn. O front continua falando
#  com a mesma origem, exatamente como hoje -- nenhuma URL muda no App.jsx.
# =============================================================================

upstream cvm_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # --- Compressao -----------------------------------------------------
    gzip_static on;
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # --- Cabecalhos de seguranca ----------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API ------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass         http://cvm_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # X-Forwarded-For precisa chegar: /api/export limita a 3 exportacoes
        # por minuto POR IP. Sem o header, todo mundo vira o IP do nginx e um
        # usuario bloquearia os demais.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # O primeiro boot baixa e processa o zip da CVM. /api/bootstrap e
        # /api/dataset devolvem payloads grandes; 60s (default) nao basta.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # A API ja aplica GZipMiddleware. Deixar o nginx bufferizar respostas
        # grandes e bom aqui (libera o worker do uvicorn mais cedo).
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass         http://cvm_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
    }

    # --- Assets com hash no nome ----------------------------------------
    # O Vite gera index-DGLVQSpM.js: o nome muda quando o conteudo muda,
    # entao o cache pode ser imutavel e longo com seguranca total.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # ATENCAO (pegadinha classica do nginx): `add_header` NAO e herdado
        # quando o bloco atual declara o proprio `add_header` -- ele SUBSTITUI
        # todos os do nivel de cima. Sem repetir aqui, o HTML sairia sem os
        # headers de seguranca definidos no server. Verificado com `curl -I`.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # --- SPA -------------------------------------------------------------
    # index.html nunca em cache (e ele que aponta para o hash novo dos assets);
    # qualquer rota desconhecida cai nele, que e o comportamento de SPA.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        # ATENCAO (pegadinha classica do nginx): `add_header` NAO e herdado
        # quando o bloco atual declara o proprio `add_header` -- ele SUBSTITUI
        # todos os do nivel de cima. Sem repetir aqui, o HTML sairia sem os
        # headers de seguranca definidos no server. Verificado com `curl -I`.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
